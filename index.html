<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Camper">
<meta name="theme-color" content="#5b6130">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Nuestra Camper</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--olive:#5b6130;--olive2:#434824;--beige:#e8dfc6;--paper:#faf7ef;--ink:#2b2a22;--mute:#7a765f;--line:#ddd3b6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:16px}
h1,h2{font-family:Fraunces,Georgia,serif;margin:0 0 12px;color:var(--olive2)}
h1{font-size:30px}h2{font-size:21px;margin-top:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.btn{background:var(--olive);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:600 16px inherit;font-family:inherit;min-height:46px}
.btn.alt{background:var(--beige);color:var(--olive2)}.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
input,textarea,select{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:4px 0 10px}
label{font-size:14px;color:var(--mute)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--olive2);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:#cfd2b0;font:13px inherit;font-family:inherit;padding:6px 0}
nav button.on{color:#fff;font-weight:700}nav span{display:block;font-size:22px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:6px}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 22px Fraunces,serif}
.profiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center}
.profiles button{background:none;border:0;font:inherit;display:flex;flex-direction:column;align-items:center;gap:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:13px}
.cal b{color:var(--mute);font-weight:500}.cal div{min-height:48px;border-radius:8px;background:#fff;border:1px solid var(--line);padding:2px;overflow:hidden}
.cal i{display:block;height:6px;border-radius:3px;margin-top:2px}.cal .x{background:none;border:0}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--beige)}.tag.confirmada{background:#cfe0b4}.tag.cancelada{background:#e8c4bd;text-decoration:line-through}
#lb{position:fixed;inset:0;background:#000d;display:none;flex-direction:column;justify-content:center;align-items:center;color:#fff;z-index:9;padding:16px}
#lb img{max-width:100%;max-height:78vh;border-radius:8px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:10}
.mute{color:var(--mute);font-size:14px}pre{white-space:pre-wrap;font:inherit;margin:4px 0 10px}
</style></head><body>
<main id="app"></main><nav id="nav"></nav>
<div id="lb" onclick="this.style.display='none'"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
// ====== CONFIGURACIÓN: pega aquí tus datos (Supabase → Project Settings → API). Solo la clave "anon/publishable". NUNCA la service_role. ======
const SUPABASE_URL='https://pdsvduxnndyybavkzhmn.supabase.co', SUPABASE_KEY='sb_publishable_VN4CmAQv9TWuMEJSyYgfVQ_d53COpP5';
// =============================================================================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={me:null,prof:{},trips:[],photos:[],bk:[],urls:{},view:'home',arg:null,month:new Date()};
const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}):'';
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3200)};
const who=id=>S.prof[id]||{name:'?',color:'#999'};
const dot=id=>`<span class="dot" style="background:${who(id).color}"></span>${esc(who(id).name)}`;

// ---------- Acceso: perfil + PIN (por debajo es Supabase Auth: email interno + PIN como contraseña) ----------
async function login(){
  const {data:ps}=await sb.from('profiles').select('*').order('created_at');
  $('#nav').innerHTML='';
  $('#app').innerHTML=`<h1>Nuestra Camper</h1><p class="mute">¿Quién eres?</p><div class="profiles">${(ps||[]).map(p=>`<button onclick="pin('${p.id}')"><div class="av" style="background:${p.color}">${esc(p.name[0])}</div>${esc(p.name)}</button>`).join('')}</div><div id="pinbox"></div>`;
  window._ps=ps;
}
window.pin=id=>{const p=_ps.find(x=>x.id===id);
  $('#pinbox').innerHTML=`<div class="card" style="margin-top:20px"><label>PIN de ${esc(p.name)} (6 dígitos)</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autofocus><button class="btn" style="width:100%" onclick="doLogin('${esc(p.name.toLowerCase())}')">Entrar</button></div>`};
window.doLogin=async n=>{const {error}=await sb.auth.signInWithPassword({email:`${n}@camper.local`,password:$('#pin').value});
  if(error)return toast('PIN incorrecto');boot()};
window.logout=async()=>{await sb.auth.signOut();location.reload()};

// ---------- Datos y tiempo real ----------
async function load(){
  const [p,t,ph,b]=await Promise.all([sb.from('profiles').select('*'),sb.from('trips').select('*').order('start_date',{ascending:false}),sb.from('photos').select('*').order('created_at',{ascending:false}),sb.from('bookings').select('*').order('start_date')]);
  S.prof=Object.fromEntries((p.data||[]).map(x=>[x.id,x]));S.trips=t.data||[];S.photos=ph.data||[];S.bk=b.data||[];
  const need=S.photos.map(x=>x.path).filter(x=>!S.urls[x]);
  if(need.length){const {data}=await sb.storage.from('photos').createSignedUrls(need,3600);(data||[]).forEach(d=>S.urls[d.path]=d.signedUrl)}
}
async function boot(){
  const {data:{session}}=await sb.auth.getSession();if(!session)return login();
  await load();S.me=S.prof[session.user.id];if(!S.me)return login();
  sb.channel('c').on('postgres_changes',{event:'*',schema:'public'},async()=>{await load();if(!document.activeElement?.matches('input,textarea,select'))render()}).subscribe();
  render();
}
window.go=(v,a=null)=>{S.view=v;S.arg=a;render();scrollTo(0,0)};
function render(){
  const tabs=[['home','🏠','Inicio'],['trips','🧭','Viajes'],['cal','📅','Calendario'],['gal','🖼️','Galería'],['me','👤','Perfil']];
  $('#nav').innerHTML=tabs.map(([k,i,l])=>`<button class="${S.view.startsWith(k)?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');
  $('#app').innerHTML=({home,trips,trip,tripForm,cal,bookForm,gal,me})[S.view]();
}

// ---------- Vistas ----------
const tripCard=t=>`<div class="card" onclick="go('trip','${t.id}')"><b>${esc(t.title)}</b><div class="mute">${esc(t.destination||'')} · ${fmt(t.start_date)}</div><div class="mute">${dot(t.author)}</div></div>`;
const bkRow=b=>`<div class="card"><div class="row"><div class="grow">${dot(b.user_id)}<div>${fmt(b.start_date)} → ${fmt(b.end_date)}</div>${b.note?`<div class="mute">${esc(b.note)}</div>`:''}</div><span class="tag ${b.status}">${b.status}</span></div>
${b.user_id===S.me.id&&b.status!=='cancelada'?`<div class="row" style="margin-top:8px">${b.status==='pendiente'?`<button class="btn sm" onclick="setBk('${b.id}','confirmada')">Confirmar</button>`:''}<button class="btn sm alt" onclick="go('bookForm','${b.id}')">Editar</button><button class="btn sm alt" onclick="setBk('${b.id}','cancelada')">Cancelar</button></div>`:''}</div>`;
function home(){const today=iso(new Date());
  return `<h1>Hola, ${esc(S.me.name)}</h1><div class="row"><button class="btn grow" onclick="go('tripForm')">＋ Nuevo viaje</button><button class="btn alt grow" onclick="go('bookForm')">Reservar</button></div>
  <h2>Próximas reservas</h2>${S.bk.filter(b=>b.end_date>=today&&b.status!=='cancelada').slice(0,3).map(bkRow).join('')||'<p class="mute">No hay reservas próximas. Reserva la camper desde el calendario.</p>'}
  <h2>Últimos viajes</h2>${S.trips.slice(0,3).map(tripCard).join('')||'<p class="mute">Aún no hay viajes. Crea el primero.</p>'}
  <h2>Últimas fotos</h2><div class="grid">${S.photos.slice(0,6).map(p=>`<img src="${S.urls[p.path]||''}" onclick="lb('${p.id}')">`).join('')}</div>`}
function trips(){const q=(S.q||'').toLowerCase(),f=S.from||'',t2=S.to||'';
  const l=S.trips.filter(t=>(!q||(t.title+t.destination).toLowerCase().includes(q))&&(!f||t.end_date>=f)&&(!t2||t.start_date<=t2));
  return `<h1>Viajes</h1><input placeholder="Buscar por nombre o destino" value="${esc(S.q||'')}" oninput="S.q=this.value;filt()"><div class="row"><div class="grow"><label>Desde</label><input type="date" value="${f}" onchange="S.from=this.value;render()"></div><div class="grow"><label>Hasta</label><input type="date" value="${t2}" onchange="S.to=this.value;render()"></div></div><div id="tl">${l.map(tripCard).join('')||'<p class="mute">Sin resultados.</p>'}</div><button class="btn" onclick="go('tripForm')">＋ Nuevo viaje</button>`}
window.filt=()=>{const p=document.activeElement,v=p.value;render();const i=$('#app input');i.focus();i.setSelectionRange(v.length,v.length)};
function trip(){const t=S.trips.find(x=>x.id===S.arg);if(!t)return trips();
  const f=(l,v)=>v?`<label>${l}</label><pre>${esc(v)}</pre>`:'';const ph=S.photos.filter(p=>p.trip_id===t.id);
  return `<button class="btn sm alt" onclick="go('trips')">‹ Viajes</button><h1 style="margin-top:12px">${esc(t.title)}</h1><div class="mute">${esc(t.destination||'')} · ${fmt(t.start_date)} – ${fmt(t.end_date)}</div><div class="mute">Publicado por ${dot(t.author)}</div>
  <div class="card">${f('Descripción',t.description)}${f('Lugares visitados',t.places)}${f('Ruta',t.route)}${f('Lugares de pernocta',t.overnight)}${f('Consejos y recomendaciones',t.tips)}</div>
  <div class="row"><button class="btn grow" onclick="go('tripForm','${t.id}')">Editar / ampliar</button><label class="btn alt grow" style="text-align:center">📷 Subir fotos<input type="file" accept="image/*" multiple hidden onchange="upload(this.files,'${t.id}')"></label></div>
  <h2>Fotos</h2><div class="grid">${ph.map(p=>`<img src="${S.urls[p.path]||''}" onclick="lb('${p.id}')">`).join('')}</div>`}
function tripForm(){const t=S.trips.find(x=>x.id===S.arg)||{};const i=(k,l,type='text')=>`<label>${l}</label><input id="f_${k}" type="${type}" value="${esc(t[k]||'')}">`,a=(k,l)=>`<label>${l}</label><textarea id="f_${k}" rows="3">${esc(t[k]||'')}</textarea>`;
  return `<h1>${t.id?'Editar viaje':'Nuevo viaje'}</h1>${i('title','Nombre del viaje')}${i('destination','Destino')}<div class="row"><div class="grow">${i('start_date','Inicio','date')}</div><div class="grow">${i('end_date','Fin','date')}</div></div>${a('description','Descripción')}${a('places','Lugares visitados')}${a('route','Ruta realizada')}${a('overnight','Lugares de pernocta')}${a('tips','Recomendaciones y consejos')}<button class="btn" onclick="saveTrip('${t.id||''}')">Guardar viaje</button> <button class="btn alt" onclick="go('trips')">Cancelar</button>`}
window.saveTrip=async id=>{const o={};['title','destination','start_date','end_date','description','places','route','overnight','tips'].forEach(k=>o[k]=$('#f_'+k).value||null);
  if(!o.title)return toast('Pon un nombre al viaje');
  const {data,error}=id?await sb.from('trips').update(o).eq('id',id).select().single():await sb.from('trips').insert(o).select().single();
  if(error)return toast(error.message);await load();toast('Viaje guardado');go('trip',data.id)};

function cal(){const y=S.month.getFullYear(),m=S.month.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate();
  const cells=['L','M','X','J','V','S','D'].map(d=>`<b>${d}</b>`);for(let i=0;i<off;i++)cells.push('<div class="x"></div>');
  for(let d=1;d<=n;d++){const k=iso(new Date(y,m,d));cells.push(`<div>${d}${S.bk.filter(b=>b.status!=='cancelada'&&b.start_date<=k&&b.end_date>=k).map(b=>`<i style="background:${who(b.user_id).color};opacity:${b.status==='pendiente'?.5:1}"></i>`).join('')}</div>`)}
  const ms=iso(first),me_=iso(new Date(y,m+1,0));
  return `<h1>Calendario</h1><div class="row"><button class="btn sm alt" onclick="S.month=new Date(${y},${m-1},1);render()">‹</button><b class="grow" style="text-align:center">${first.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</b><button class="btn sm alt" onclick="S.month=new Date(${y},${m+1},1);render()">›</button></div><br><div class="cal">${cells.join('')}</div><p class="mute">Color más claro = pendiente.</p><button class="btn" style="width:100%" onclick="go('bookForm')">＋ Nueva reserva</button><h2>Reservas del mes</h2>${S.bk.filter(b=>b.start_date<=me_&&b.end_date>=ms).map(bkRow).join('')||'<p class="mute">Sin reservas este mes.</p>'}`}
function bookForm(){const b=S.bk.find(x=>x.id===S.arg)||{};
  return `<h1>${b.id?'Editar reserva':'Nueva reserva'}</h1><label>Fecha de inicio</label><input id="b_s" type="date" value="${b.start_date||''}"><label>Fecha de fin</label><input id="b_e" type="date" value="${b.end_date||''}"><label>Nota (opcional)</label><input id="b_n" value="${esc(b.note||'')}"><button class="btn" onclick="saveBk('${b.id||''}')">Guardar reserva</button> <button class="btn alt" onclick="go('cal')">Cancelar</button>`}
window.saveBk=async id=>{const o={start_date:$('#b_s').value,end_date:$('#b_e').value,note:$('#b_n').value||null};
  if(!o.start_date||!o.end_date||o.end_date<o.start_date)return toast('Revisa las fechas');
  const {error}=id?await sb.from('bookings').update(o).eq('id',id):await sb.from('bookings').insert(o);
  if(error)return toast(error.code==='23P01'?'Esas fechas se solapan con otra reserva':error.message);await load();toast('Reserva guardada');go('cal')};
window.setBk=async(id,s)=>{const {error}=await sb.from('bookings').update({status:s}).eq('id',id);if(error)return toast(error.message);await load();render()};

function gal(){return `<h1>Galería</h1><label class="btn" style="display:block;text-align:center">📷 Subir fotos<input type="file" accept="image/*" multiple hidden onchange="upload(this.files,null)"></label><br><div class="grid">${S.photos.map(p=>`<img src="${S.urls[p.path]||''}" onclick="lb('${p.id}')">`).join('')||'<p class="mute">Todavía no hay fotos.</p>'}</div>`}
window.lb=id=>{const p=S.photos.find(x=>x.id===id),t=S.trips.find(x=>x.id===p.trip_id);$('#lb').innerHTML=`<img src="${S.urls[p.path]}"><p>${dot(p.author)} · ${fmt(p.created_at.slice(0,10))}${t?' · '+esc(t.title):''}</p>${p.author===S.me.id?`<button class="btn sm alt" onclick="event.stopPropagation();delPh('${p.id}')">Borrar foto</button>`:''}`;$('#lb').style.display='flex'};
window.delPh=async id=>{const p=S.photos.find(x=>x.id===id);await sb.storage.from('photos').remove([p.path]);await sb.from('photos').delete().eq('id',id);$('#lb').style.display='none';await load();render()};
function shrink(file){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.8)};im.src=URL.createObjectURL(file)})}
window.upload=async(files,tripId)=>{toast('Subiendo…');let ok=0;
  for(const f of files){const b=await shrink(f),path=`${S.me.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
    const u=await sb.storage.from('photos').upload(path,b,{contentType:'image/jpeg'});if(u.error){toast(u.error.message);continue}
    await sb.from('photos').insert({path,trip_id:tripId});ok++}
  await load();render();toast(`${ok} foto(s) subida(s)`)};

function me(){return `<h1>Perfiles</h1>${Object.values(S.prof).map(p=>`<div class="card row"><div class="av" style="background:${p.color}">${esc(p.name[0])}</div><div class="grow"><b>${esc(p.name)}</b>${p.id===S.me.id?' (tú)':''}</div></div>`).join('')}
  <div class="card"><label>Mi nombre</label><input id="pn" value="${esc(S.me.name)}" disabled><label>Mi color</label><input id="pc" type="color" value="${S.me.color}" style="height:48px"><button class="btn" onclick="saveMe()">Guardar perfil</button></div>
  <div class="card"><label>Cambiar mi PIN (6 dígitos)</label><input id="np" type="password" inputmode="numeric" maxlength="6"><button class="btn alt" onclick="chPin()">Cambiar PIN</button></div><button class="btn alt" onclick="logout()">Cerrar sesión</button>`}
window.saveMe=async()=>{await sb.from('profiles').update({color:$('#pc').value}).eq('id',S.me.id);await load();S.me=S.prof[S.me.id];toast('Perfil guardado');render()};
window.chPin=async()=>{const v=$('#np').value;if(!/^\d{6}$/.test(v))return toast('El PIN debe tener 6 dígitos');const {error}=await sb.auth.updateUser({password:v});toast(error?error.message:'PIN cambiado')};

if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
boot();
</script></body></html>
